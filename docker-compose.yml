version: "3.9"

services:
  dv1-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dv1-visualization-engine
    ports:
      - "8000:8000"
    environment:
      - DV1_REDIS_URL=redis://redis:6379/0
      - DV1_CACHE_ENABLED=true
      - DV1_CACHE_TTL=3600
      - DV1_LOG_LEVEL=INFO
      - DV1_MAX_PAYLOAD_SIZE=10485760
    volumes:
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dv1-network

  redis:
    image: redis:7-alpine
    container_name: dv1-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - dv1-network

  nginx:
    image: nginx:alpine
    container_name: dv1-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dv1-api
    restart: unless-stopped
    networks:
      - dv1-network

volumes:
  redis-data:

networks:
  dv1-network:
    driver: bridge